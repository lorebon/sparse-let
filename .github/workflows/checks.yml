name: checks

on: [push, pull_request]

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check src examples
      - run: python -m ruff format --check src examples
      - run: python src/run_experiment.py --dataset AUSLAN2 --folds 2 --generations 2 --population-size 12 --queries 2 --output results/ci-smoke
      - run: python examples/fit_and_predict.py
